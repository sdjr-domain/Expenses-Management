{% extends "base.html" %}

{% block title %}Sign in — Spendly{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-6">
    <div class="max-w-md w-full">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-slate-900 mb-3">Welcome back</h1>
            <p class="text-slate-500">Sign in to your Spendly account</p>
        </div>

        <div class="bg-white border border-slate-200 rounded-2xl p-8 shadow-sm">
            {% if error %}
            <div class="bg-red-50 text-red-600 p-4 rounded-lg text-sm mb-6 border border-red-100">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-2">Email address</label>
                    <input type="email" id="email" name="email"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-all outline-none placeholder:text-slate-400"
                           placeholder="nitish@example.com"
                           required autofocus>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                    <input type="password" id="password" name="password"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-all outline-none placeholder:text-slate-400"
                           placeholder="Your password"
                           required>
                </div>
                <button type="submit" class="w-full bg-slate-900 text-white py-3 rounded-xl font-medium hover:bg-slate-800 transition-all shadow-lg shadow-slate-200">
                    Sign in
                </button>
            </form>
        </div>

        <p class="text-center mt-8 text-sm text-slate-500">
            Don't have an account?
            <a href="{{ url_for('register') }}" class="text-slate-900 font-semibold hover:underline transition-colors">Create one free</a>
        </p>
    </div>
</div>
{% endblock %}
