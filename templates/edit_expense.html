{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-6 py-12">
    <div class="mb-12">
        <h1 class="serif text-4xl text-slate-900 dark:text-white mb-2">Edit Expense</h1>
        <p class="text-slate-500 dark:text-slate-400">Update the details of your spending.</p>
    </div>

    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 shadow-sm">
        <form method="POST" class="space-y-6">
            <div>
                <label for="amount" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Amount</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500">₹</span>
                    <input type="number" step="0.01" name="amount" id="amount" value="{{ expense.amount }}" required
                           class="w-full pl-7 pr-4 py-3 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:focus:ring-emerald-500/20 focus:border-emerald-500 dark:focus:border-emerald-500 transition-all">
                </div>
            </div>

            <div>
                <label for="category" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Category</label>
                <select name="category" id="category" required
                        class="w-full px-4 py-3 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:focus:ring-emerald-500/20 focus:border-emerald-500 dark:focus:border-emerald-500 transition-all">
                    {% for cat in user_categories %}
                    <option value="{{ cat.name }}" {% if expense.category == cat.name %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="date" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Date</label>
                <input type="date" name="date" id="date" value="{{ expense.date }}" required
                       class="w-full px-4 py-3 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:focus:ring-emerald-500/20 focus:border-emerald-500 dark:focus:border-emerald-500 transition-all">
            </div>

            <div>
                <label for="description" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Description</label>
                <input type="text" name="description" id="description" value="{{ expense.description or '' }}"
                       class="w-full px-4 py-3 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:focus:ring-emerald-500/20 focus:border-emerald-500 dark:focus:border-emerald-500 transition-all">
            </div>

            <div class="pt-4 flex items-center justify-between gap-4">
                <a href="{{ url_for('dashboard') }}" class="text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors">Cancel</a>
                <button type="submit" class="bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 px-8 py-3 rounded-full text-sm font-medium hover:bg-slate-800 dark:hover:bg-slate-200 transition-all shadow-lg shadow-slate-200 dark:shadow-none">
                    Update Expense
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
