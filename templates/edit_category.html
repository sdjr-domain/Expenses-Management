{% extends "base.html" %}

{% block title %}Edit Category — Spendly{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-6 py-12">
    <div class="mb-12">
        <h1 class="serif text-4xl text-slate-900 mb-2">Edit Category</h1>
        <p class="text-slate-500">Update the name of your category.</p>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl p-8 shadow-sm">
        <form method="POST" class="space-y-6">
            <div>
                <label for="name" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Category Name</label>
                <input type="text" name="name" id="name" value="{{ category.name }}" required
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">
            </div>
            <div class="pt-4 flex items-center justify-between gap-4">
                <a href="{{ url_for('categories') }}" class="text-sm font-medium text-slate-500 hover:text-slate-900 transition-colors">Cancel</a>
                <button type="submit" class="bg-slate-900 text-white px-8 py-3 rounded-full text-sm font-medium hover:bg-slate-800 transition-all shadow-lg shadow-slate-200">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
