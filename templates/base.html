<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Spendly{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, .serif { font-family: 'Playfair Display', serif; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-white text-slate-900">

    <nav class="flex items-center justify-between px-6 py-4 max-w-7xl mx-auto">
        <a href="{{ url_for('landing') }}" class="flex items-center gap-2 text-lg font-semibold tracking-tight">
            <span class="text-emerald-600">◈</span>
            <span>Spendly</span>
        </a>
        <div class="flex items-center gap-6">
            <a href="{{ url_for('login') }}" class="text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors">Sign in</a>
            <a href="{{ url_for('register') }}" class="bg-slate-900 text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-slate-800 transition-all">Get started</a>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-100 mt-20 py-12 px-6">
        <div class="max-w-7xl mx-auto flex flex-col items-center gap-4 text-center">
            <div class="flex items-center gap-2 text-lg font-semibold">
                <span class="text-emerald-600">◈</span>
                <span>Spendly</span>
            </div>
            <p class="text-slate-500 text-sm">Track every rupee. Own your finances.</p>
            <div class="flex gap-6 text-sm text-slate-400">
                <a href="#" class="hover:text-slate-600 transition-colors">Chat</a>
                <a href="{{ url_for('terms') }}" class="hover:text-slate-600 transition-colors">Terms and Conditions</a>
                <a href="{{ url_for('privacy') }}" class="hover:text-slate-600 transition-colors">Privacy Policy</a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
