{% extends "base.html" %}

{% block title %}Add Transaction — Spendly{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-6 py-12">
    <div class="mb-8">
        <h1 class="serif text-4xl text-slate-900 dark:text-white mb-2">Add Transaction</h1>
        <p class="text-slate-500 dark:text-slate-400">Record your income or expense to keep your finances up to date.</p>
    </div>

    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-xl shadow-slate-100/50 dark:shadow-none">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">Transaction Type</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="relative flex items-center justify-center p-4 rounded-2xl border-2 cursor-pointer transition-all has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50 dark:has-[:checked]:border-emerald-500 dark:has-[:checked]:bg-emerald-900/30 border-slate-100 dark:border-slate-800 hover:border-slate-200 dark:hover:border-slate-700 group">
                            <input type="radio" name="type" value="income" class="hidden peer">
                            <div class="flex items-center gap-2">
                                <span class="w-6 h-6 rounded-full bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-xs font-bold">↓</span>
                                <span class="text-sm font-semibold text-slate-700 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-white">Income</span>
                            </div>
                        </label>
                        <label class="relative flex items-center justify-center p-4 rounded-2xl border-2 cursor-pointer transition-all has-[:checked]:border-rose-500 has-[:checked]:bg-rose-50 dark:has-[:checked]:border-rose-500 dark:has-[:checked]:bg-rose-900/30 border-slate-100 dark:border-slate-800 hover:border-slate-200 dark:hover:border-slate-700 group">
                            <input type="radio" name="type" value="expense" class="hidden peer" checked>
                            <div class="flex items-center gap-2">
                                <span class="w-6 h-6 rounded-full bg-rose-100 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 flex items-center justify-center text-xs font-bold">↑</span>
                                <span class="text-sm font-semibold text-slate-700 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-white">Expense</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">Amount</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 font-medium">₹</span>
                        <input type="number" step="0.01" name="amount" required class="w-full pl-8 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-medium transition-all focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:focus:ring-emerald-500/20 focus:border-emerald-500 dark:focus:border-emerald-500 placeholder:text-slate-400 dark:placeholder:text-slate-500" placeholder="0.00">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">Category</label>
                    <select name="category" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white transition-all focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:focus:ring-emerald-500/20 focus:border-emerald-500 dark:focus:border-emerald-500">
                        <option value="Other">Other</option>
                        {% for cat in user_categories %}
                        <option value="{{ cat.name }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">Date</label>
                    <input type="date" name="date" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white transition-all focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:focus:ring-emerald-500/20 focus:border-emerald-500 dark:focus:border-emerald-500">
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">Description</label>
                    <input type="text" name="description" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white transition-all focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:focus:ring-emerald-500/20 focus:border-emerald-500 dark:focus:border-emerald-500" placeholder="Optional details...">
                </div>
            </div>

            <div class="flex items-center justify-end gap-4 pt-6">
                <a href="{{ url_for('dashboard') }}" class="px-6 py-3 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors">Cancel</a>
                <button type="submit" class="bg-slate-900 text-white dark:bg-emerald-500 dark:text-white px-8 py-3 rounded-full text-sm font-medium hover:bg-slate-800 dark:hover:bg-emerald-600 transition-all shadow-lg shadow-slate-200 dark:shadow-emerald-500/20">
                    Save Transaction
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
