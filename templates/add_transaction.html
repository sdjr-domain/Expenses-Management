{% extends "base.html" %}

{% block title %}Add Transaction — Spendly{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-6 py-12">
    <div class="mb-8">
        <h1 class="serif text-4xl text-slate-900 mb-2">Add Transaction</h1>
        <p class="text-slate-500">Record your income or expense to keep your finances up to date.</p>
    </div>

    <div class="bg-white border border-slate-200 rounded-3xl p-8 shadow-xl shadow-slate-100/50">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Transaction Type</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="relative flex items-center justify-center p-4 rounded-2xl border-2 cursor-pointer transition-all peer-checked:border-emerald-500 peer-checked:bg-emerald-50 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50 border-slate-100 hover:border-slate-200 group">
                            <input type="radio" name="type" value="expense" class="hidden peer" checked>
                            <div class="flex items-center gap-2">
                                <span class="w-6 h-6 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-xs font-bold">↑</span>
                                <span class="text-sm font-semibold text-slate-700 group-hover:text-slate-900">Expense</span>
                            </div>
                        </label>
                        <label class="relative flex items-center justify-center p-4 rounded-2xl border-2 cursor-pointer transition-all has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50 border-slate-100 hover:border-slate-200 group">
                            <input type="radio" name="type" value="income" class="hidden peer">
                            <div class="flex items-center gap-2">
                                <span class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xs font-bold">↓</span>
                                <span class="text-sm font-semibold text-slate-700 group-hover:text-slate-900">Income</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Amount</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">₹</span>
                        <input type="number" step="0.01" name="amount" required class="w-full pl-8 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 text-slate-900 font-medium transition-all" placeholder="0.00">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Category</label>
                    <select name="category" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 text-slate-900 transition-all">
                        <option value="Other">Other</option>
                        {% for cat in user_categories %}
                        <option value="{{ cat.name }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Date</label>
                    <input type="date" name="date" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 text-slate-900 transition-all">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Description</label>
                    <input type="text" name="description" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 text-slate-900 transition-all" placeholder="Optional details...">
                </div>
            </div>

            <div class="flex items-center justify-end gap-4 pt-6">
                <a href="{{ url_for('dashboard') }}" class="px-6 py-3 text-sm font-medium text-slate-500 hover:text-slate-900 transition-colors">Cancel</a>
                <button type="submit" class="bg-slate-900 text-white px-8 py-3 rounded-full text-sm font-medium hover:bg-slate-800 transition-all shadow-lg shadow-slate-200">
                    Save Transaction
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
