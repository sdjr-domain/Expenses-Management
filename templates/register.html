{% extends "base.html" %}

{% block title %}Create account — Spendly{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-6">
    <div class="max-w-md w-full">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-slate-900 dark:text-white mb-3">Create your account</h1>
            <p class="text-slate-500 dark:text-slate-400">Start tracking your expenses today</p>
        </div>

        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 shadow-sm">
            {% if error %}
            <div class="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 p-4 rounded-lg text-sm mb-6 border border-red-100 dark:border-red-800">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/register" class="space-y-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Full name</label>
                    <input type="text" id="name" name="name"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-slate-900 dark:focus:ring-slate-100 focus:border-slate-900 dark:focus:border-slate-100 transition-all outline-none placeholder:text-slate-400 dark:placeholder:text-slate-500"
                           placeholder="Nitish Kumar"
                           required autofocus>
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Email address</label>
                    <input type="email" id="email" name="email"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-slate-900 dark:focus:ring-slate-100 focus:border-slate-900 dark:focus:border-slate-100 transition-all outline-none placeholder:text-slate-400 dark:placeholder:text-slate-500"
                           placeholder="nitish@example.com"
                           required>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Password</label>
                    <input type="password" id="password" name="password"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-slate-900 dark:focus:ring-slate-100 focus:border-slate-900 dark:focus:border-slate-100 transition-all outline-none placeholder:text-slate-400 dark:placeholder:text-slate-500"
                           placeholder="Min. 8 characters"
                           required>
                </div>
                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-slate-900 dark:focus:ring-slate-100 focus:border-slate-900 dark:focus:border-slate-100 transition-all outline-none placeholder:text-slate-400 dark:placeholder:text-slate-500"
                           placeholder="Repeat your password"
                           required>
                </div>
                <button type="submit" class="w-full bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 py-3 rounded-xl font-medium hover:bg-slate-800 dark:hover:bg-slate-200 transition-all shadow-lg shadow-slate-200 dark:shadow-none">
                    Create account
                </button>
            </form>
        </div>

        <p class="text-center mt-8 text-sm text-slate-500 dark:text-slate-400">
            Already have an account?
            <a href="{{ url_for('login') }}" class="text-slate-900 dark:text-white font-semibold hover:underline transition-colors">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
